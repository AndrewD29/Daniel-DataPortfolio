<!DOCTYPE HTML>
<html lang="en">
<head>
    <title>Daniel Andrew | BI & Data Portfolio</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <!-- Using stable Font Awesome CDN to guarantee all icons render successfully -->
    <link rel="stylesheet" href="https://cloudflare.com" />
    <style>
        /* 1. MASTER SETTINGS */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { 
            width: 100%; 
            background-color: #0b0f19; /* Premium deep slate background */
            color: #f8fafc;
            font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        /* 2. NAVIGATION BAR */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(11, 15, 25, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 1000;
        }

        .logo {
            font-weight: 800;
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: #38bdf8; /* Bright data-cyan accent */
        }

        header nav ul {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        header nav ul li a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s;
        }

        header nav ul li a:hover {
            color: #38bdf8;
        }

        /* 3. HERO SECTION */
        #intro {
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            padding: 100px 10% 40px 10%;
            background: radial-gradient(circle at 80% 40%, rgba(56, 189, 248, 0.08), transparent 45%),
                        radial-gradient(circle at 20% 80%, rgba(52, 152, 219, 0.05), transparent 50%);
            position: relative;
        }

        .badge {
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 25px;
            border: 1px solid rgba(56, 189, 248, 0.2);
            display: inline-block;
        }

        #intro h1 { 
            font-size: clamp(2.5rem, 6vw, 4.5rem); 
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -1px;
            color: #ffffff;
            margin-bottom: 20px;
        }

        #intro h1 span {
            color: #38bdf8; /* Replaced broken clip logic with pure CSS styling to guarantee visibility */
        }

        #intro p {
            max-width: 650px;
            font-size: 1.2rem;
            line-height: 1.6;
            color: #94a3b8;
            margin-bottom: 30px;
        }

        /* Guaranteed Visibility Interactive Button Layouts */
        .cta-btn {
            display: inline-block !important;
            background-color: #38bdf8;
            color: #0b0f19;
            padding: 14px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            box-shadow: 0 4px 20px rgba(56, 189, 248, 0.25);
            transition: transform 0.3s, box-shadow 0.3s;
            margin-bottom: 35px;
        }

        .cta-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(56, 189, 248, 0.4);
        }

        /* HERO TECH BUTTON SYSTEM */
        .hero-badges {
            display: flex !important;
            gap: 15px;
            flex-wrap: wrap;
            width: 100%;
            margin-top: 10px;
        }

        .hero-badge {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #e2e8f0;
            transition: border-color 0.3s, background 0.3s;
        }

        .hero-badge:hover {
            border-color: rgba(56, 189, 248, 0.4);
            background: rgba(56, 189, 248, 0.02);
            color: #ffffff;
        }

        .hero-badge i {
            color: #38bdf8;
            font-size: 1.15rem;
        }

        /* 4. CONTENT SECTIONS GENERAL */
        .section {
            width: 100%;
            padding: 100px 10%;
            display: flex;
            flex-direction: column;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
        }

        .section-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 45px;
            position: relative;
            color: #ffffff;
        }

        .section-title span {
            color: #38bdf8;
        }

        /* 5. ABOUT & SKILLS GRID */
        .about-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: start;
        }

        .about-text {
            font-size: 1.1rem;
            line-height: 1.7;
            color: #94a3b8;
        }

        .skills-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); 
            gap: 16px; 
            width: 100%;
        }

        .skill-card { 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center; 
            padding: 25px 15px; 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.02);
            transition: border 0.3s, background 0.3s, transform 0.3s;
        }

        .skill-card:hover {
            border-color: rgba(56, 189, 248, 0.3);
            background: rgba(56, 189, 248, 0.03);
            transform: translateY(-3px);
        }

        .skill-card i { 
            font-size: 2.2em; 
            color: #38bdf8; 
            margin-bottom: 14px; 
        }

        .skill-card p {
            font-size: 0.95rem;
            font-weight: 600;
            color: #e2e8f0;
        }

        /* 6. PROJECTS DASHBOARD GALLERY */
        .gallery { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); 
            gap: 30px; 
            width: 100%;
        }

        .gallery-item { 
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px; 
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
            border-color: rgba(56, 189, 248, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .image-wrapper {
            width: 100%;
            height: 210px;
            overflow: hidden;
            position: relative;
            background: #1e293b;
        }

        .gallery-item img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover;
            transition: transform 0.5s;
        }

        .gallery-item:hover img {
            transform: scale(1.04);
        }

        .project-info {
            padding: 25px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .project-tags {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .tag {
            font-size: 0.75rem;
            background: rgba(255,255,255,0.05);
            color: #94a3b8;
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: 500;
        }

        .project-info h3 {
            font-size: 1.25rem;
            color: #ffffff;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .project-info p {
            font-size: 0.95rem;
            color: #94a3b8;
            line-height: 1.5;
        }

        /* 7. FOOTER */
        footer {
            background: #070a10;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding: 40px 0;
            color: #64748b;
            font-size: 0.9rem;
        }

        /* RESPONSIVE LAYOUT RESPONSES */
        @media (max-width: 968px) {
            .about-layout {
                grid-template-columns: 1fr;
                gap: 40px;
            }
            #intro { padding: 80px 5% 40px 5%; }
            .section { padding: 80px 5%; }
        }

        @media (max-width: 480px) {
            header nav { display: none; } 
            .skills-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">DA.DATA</div>
        <nav>
            <ul>
                <li><a href="#intro">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#projects">Work</a></li>
            </ul>
        </nav>
    </header>

    <section id="intro">
